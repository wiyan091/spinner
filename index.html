<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>🎡 Spinner It Dept Imam Sholat</title>

    <link rel="icon" type="image/png" href="itdept.png">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #111827, #020617);
            background-size: 200% 200%;
            color: #e5e7eb;
            overflow: hidden;
            animation: bgMove 18s ease-in-out infinite;
        }

        @keyframes bgMove {
            0% {
                background-position: 0% 0%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 0%;
            }
        }

        /* JUDUL ATAS */
        .page-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-top: 20px;
            margin-bottom: 10px;
            text-align: center;
            color: #e5e7eb;
            text-shadow:
                0 0 8px rgba(59, 130, 246, 0.8),
                0 0 18px rgba(56, 189, 248, 0.6);
        }

        .subtitle {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .container {
            display: flex;
            gap: 2rem;
            align-items: center;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .wheel-wrapper {
            position: relative;
        }

        /* Aura neon di belakang wheel */
        .wheel-aura {
            position: absolute;
            inset: -28px;
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                    #f97316,
                    #22c55e,
                    #3b82f6,
                    #ec4899,
                    #facc15,
                    #f97316);
            filter: blur(18px) opacity(0.9);
            animation: auraSpin 10s linear infinite;
            z-index: -1;
        }

        @keyframes auraSpin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        canvas {
            border-radius: 50%;
            box-shadow:
                0 0 0 8px rgba(15, 23, 42, 0.9),
                0 30px 60px rgba(0, 0, 0, 0.7);
            background: radial-gradient(circle, #111827 0, #020617 60%, #000 100%);
        }

        /* Glow saat spinning */
        .wheel-wrapper.spinning canvas {
            animation: glowPulse 1s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0% {
                box-shadow:
                    0 0 0 8px rgba(15, 23, 42, 0.9),
                    0 30px 60px rgba(0, 0, 0, 0.7);
            }

            50% {
                box-shadow:
                    0 0 0 8px rgba(59, 130, 246, 0.9),
                    0 40px 80px rgba(37, 99, 235, 0.8);
            }

            100% {
                box-shadow:
                    0 0 0 8px rgba(15, 23, 42, 0.9),
                    0 30px 60px rgba(0, 0, 0, 0.7);
            }
        }

        /* Pointer di atas wheel, menghadap ke bawah */
        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-bottom: 0;
            border-top: 36px solid #ef4444;
            filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.7));
        }

        /* Pointer bounce saat winner */
        .pointer.win {
            animation: pointerBounce 0.6s ease-out 2;
        }

        @keyframes pointerBounce {
            0% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(5px);
            }

            100% {
                transform: translateX(-50%) translateY(0);
            }
        }

        .center-circle {
            position: absolute;
            inset: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #111827;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.2);
            transition: background 0.2s ease, color 0.2s ease;
        }

        /* Pop effect saat winner */
        .center-circle.win {
            background: #facc15;
            color: #111827;
            animation: popWin 0.5s ease-out;
        }

        @keyframes popWin {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
            }

            60% {
                transform: translate(-50%, -50%) scale(1.2);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: rgba(15, 23, 42, 0.96);
            padding: 1.25rem;
            border-radius: 16px;
            width: 260px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
        }

        .controls h2 {
            margin: 0 0 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: .03em;
            text-transform: uppercase;
            color: #9ca3af;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            resize: vertical;
            border-radius: 10px;
            border: 1px solid #1f2937;
            background: #020617;
            color: #e5e7eb;
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
            line-height: 1.4;
            outline: none;
        }

        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px #3b82f6;
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 0.7rem 1.6rem;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
            cursor: pointer;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            box-shadow: 0 12px 25px rgba(234, 88, 12, 0.6);
            transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
        }

        button:active {
            transform: translateY(1px) scale(.98);
            box-shadow: 0 6px 15px rgba(234, 88, 12, 0.6);
            filter: brightness(.95);
        }

        .meta {
            font-size: 0.8rem;
            color: #9ca3af;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .winner {
            font-size: 0.9rem;
            color: #facc15;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(250, 204, 21, 0.6);
            transition: transform 0.3s ease;
        }

        .winner.glow {
            animation: winnerGlow 1s ease-in-out 3;
        }

        @keyframes winnerGlow {
            0% {
                transform: scale(1);
                text-shadow: 0 0 4px rgba(250, 204, 21, 0.6);
            }

            50% {
                transform: scale(1.12);
                text-shadow: 0 0 14px rgba(250, 204, 21, 1);
            }

            100% {
                transform: scale(1);
                text-shadow: 0 0 4px rgba(250, 204, 21, 0.6);
            }
        }

        /* Confetti overlay */
        #confetti {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 14px;
            border-radius: 2px;
            opacity: 0.9;
            animation: confetti-fall 1.8s linear forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-20px) rotateZ(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotateZ(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div id="confetti"></div>

    <!-- JUDUL HALAMAN -->
    <div class="page-title">Spinner IT Dept Imam Sholat</div>
    <div class="subtitle">Lucky wheel for IT team</div>

    <div class="container">
        <div class="wheel-wrapper">
            <div class="wheel-aura"></div>
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
            <div class="pointer"></div>
            <div class="center-circle">Click to spin</div>
        </div>

        <div class="controls">
            <h2>Entries</h2>
            <textarea id="entriesInput">
Tahir
Abdi
Sindu
Jaya
Farhan
Hendry
    </textarea>

            <button id="spinButton">Spin</button>

            <div class="meta">
                <span style="font-size:0.8rem;">Tip: klik wheel atau tombol Spin</span>
                <span class="winner" id="winnerLabel">Winner: <span id="winnerName">-</span></span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const entriesInput = document.getElementById('entriesInput');
        const centerCircle = document.querySelector('.center-circle');
        const spinButton = document.getElementById('spinButton');
        const winnerNameEl = document.getElementById('winnerName');
        const winnerLabel = document.getElementById('winnerLabel');
        const wheelWrapper = document.querySelector('.wheel-wrapper');
        const pointer = document.querySelector('.pointer');

        const sliceColors = [
            '#ef4444', '#3b82f6', '#22c55e', '#f59e0b',
            '#6366f1', '#ec4899', '#14b8a6', '#f97316'
        ];

        let names = [];
        let rotation = 0;
        let angularVelocity = 0;
        let spinning = false;
        const baseRotation = -Math.PI / 2;

        function parseNames() {
            names = entriesInput.value
                .split('\n')
                .map(s => s.trim())
                .filter(Boolean);
        }

        function drawWheel() {
            const size = canvas.width;
            const cx = size / 2;
            const cy = size / 2;
            const radius = size / 2 - 10;

            ctx.clearRect(0, 0, size, size);

            if (!names.length) {
                ctx.fillStyle = '#e5e7eb';
                ctx.font = '16px system-ui';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Tambahkan nama di sebelah kanan', cx, cy);
                return;
            }

            const arc = 2 * Math.PI / names.length;

            for (let i = 0; i < names.length; i++) {
                const startAngle = baseRotation + rotation + i * arc;
                const endAngle = startAngle + arc;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = sliceColors[i % sliceColors.length];
                ctx.fill();
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px system-ui';
                ctx.fillText(names[i], radius - 25, 6);
                ctx.restore();
            }
        }

        function angleDiff(a, b) {
            let diff = (a - b) % (2 * Math.PI);
            if (diff < -Math.PI) diff += 2 * Math.PI;
            if (diff > Math.PI) diff -= 2 * Math.PI;
            return diff;
        }

        function fireConfetti() {
            const container = document.getElementById('confetti');
            container.innerHTML = '';
            const colors = ['#facc15', '#f97316', '#22c55e', '#3b82f6', '#ec4899'];

            for (let i = 0; i < 120; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.backgroundColor = colors[i % colors.length];
                piece.style.animationDelay = (Math.random() * 0.7) + 's';
                piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                container.appendChild(piece);
            }

            setTimeout(() => {
                container.innerHTML = '';
            }, 2500);
        }

        function stopAndPickWinner() {
            if (!names.length) return;
            const arc = 2 * Math.PI / names.length;
            const pointerAngle = -Math.PI / 2;

            let bestIndex = 0;
            let bestDiff = Infinity;

            for (let i = 0; i < names.length; i++) {
                const startAngle = baseRotation + rotation + i * arc;
                const midAngle = startAngle + arc / 2;
                const diff = Math.abs(angleDiff(midAngle, pointerAngle));
                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestIndex = i;
                }
            }

            const winner = names[bestIndex];
            winnerNameEl.textContent = winner || '-';
            centerCircle.textContent = winner || 'No entry';

            wheelWrapper.classList.remove('spinning');
            centerCircle.classList.add('win');
            pointer.classList.add('win');
            winnerLabel.classList.add('glow');
            fireConfetti();

            if (winner) {
                setTimeout(() => {
                    Swal.fire({
                        title: '🎉 Pemenang!',
                        html: `<div style="font-size:26px;font-weight:700;margin-top:4px;">${winner}</div>`,
                        icon: 'success',
                        confirmButtonText: 'Selamat Kamu Jadi Imam Sholat 🔥',
                        confirmButtonColor: '#22c55e',
                        background: '#020617',
                        color: '#e5e7eb',
                        backdrop: `
                            rgba(15,23,42,0.85)
                            left top
                            no-repeat
                        `
                    });
                }, 450);
            }
        }

        function step() {
            if (!spinning) return;
            rotation += angularVelocity;
            angularVelocity *= 0.985;

            if (angularVelocity < 0.002) {
                spinning = false;
                angularVelocity = 0;
                stopAndPickWinner();
                drawWheel();
                return;
            }

            drawWheel();
            requestAnimationFrame(step);
        }

        function startSpin() {
            if (spinning) return;
            parseNames();
            if (!names.length) return;

            winnerNameEl.textContent = '...';
            centerCircle.textContent = 'Spinning...';
            centerCircle.classList.remove('win');
            pointer.classList.remove('win');
            winnerLabel.classList.remove('glow');
            wheelWrapper.classList.add('spinning');

            angularVelocity = 0.35 + Math.random() * 0.25;
            spinning = true;
            step();
        }

        entriesInput.addEventListener('input', () => {
            parseNames();
            winnerNameEl.textContent = '-';
            centerCircle.textContent = 'Click to spin';
            rotation = 0;
            drawWheel();
        });

        spinButton.addEventListener('click', startSpin);
        canvas.addEventListener('click', startSpin);

        parseNames();
        drawWheel();
    </script>
</body>


</html>
